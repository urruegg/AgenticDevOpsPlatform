name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            **/*.md
            #node_modules
            #.actionlint

  markdown-link-check:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check@3.12.2

      - name: Check links
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          status=0
          for f in docs/**/*.md sprints/*.md .github/*.md AGENTS.md README.md; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            markdown-link-check --quiet "$f" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true

  bicep-build:
    name: Bicep build (infra/landing-zone)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build all Bicep templates under infra/**
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          # azure-cli ships with bicep on ubuntu-latest runners; ensure it's available.
          if ! az bicep version >/dev/null 2>&1; then
            az bicep install
          fi
          az bicep version
          found=0
          for f in infra/**/*.bicep; do
            [ -f "$f" ] || continue
            found=1
            echo "::group::$f"
            az bicep build --file "$f" --stdout >/dev/null
            echo "::endgroup::"
          done
          for f in infra/**/*.bicepparam; do
            [ -f "$f" ] || continue
            found=1
            echo "::group::$f"
            az bicep build-params --file "$f" --stdout >/dev/null
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "::notice::No Bicep files under infra/ — skipping."
          fi

